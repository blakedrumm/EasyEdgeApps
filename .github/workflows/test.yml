name: Windows Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse all PowerShell source
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Core behavior and safety
        run: ./tests/Test-EasyEdgeApps.ps1
      - name: Native setup controls and layout
        run: ./tests/Test-EasyEdgeAppsGui.ps1 -MaximumWindowWidth 1024 -MaximumWindowHeight 768